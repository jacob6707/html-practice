<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
		<link rel="stylesheet" href="style.css" />
		<script
			src="https://kit.fontawesome.com/ee49ee0006.js"
			crossorigin="anonymous"
		></script>
	</head>
	<body>
		<header class="main-header">
			<h1 class="main-title">Sudoku</h1>
			<nav class="main-nav">
				<ul>
					<li>Scores</li>
					<li>How To Play</li>
					<li>Settings</li>
				</ul>
			</nav>
		</header>

		<main class="game-container">
			<header class="game-header">
				<h2 class="game-title">Game</h2>
				<div class="game-controls">
					<select class="difficulty-select" id="difficulty-select">
						<option value="easy">Easy</option>
						<option value="medium">Medium</option>
						<option value="hard">Hard</option>
					</select>
					<button class="new-game-button" id="new-game">New Game</button>
				</div>
			</header>
			<main class="game-board">
				<div class="sudoku-grid" id="sudoku-grid">
					<!-- Sudoku grid will be generated here -->
				</div>
			</main>
		</main>
		<footer class="game-footer">
			<button class="game-button" id="note-button">
				<i class="fa-solid fa-pencil"></i>
			</button>
			<button class="game-button" id="number-1">1</button>
			<button class="game-button" id="number-2">2</button>
			<button class="game-button" id="number-3">3</button>
			<button class="game-button" id="number-4">4</button>
			<button class="game-button" id="number-5">5</button>
			<button class="game-button" id="number-6">6</button>
			<button class="game-button" id="number-7">7</button>
			<button class="game-button" id="number-8">8</button>
			<button class="game-button" id="number-9">9</button>
			<button class="game-button" id="check-button">
				<i class="fa-solid fa-check"></i>
			</button>
			<button class="game-button" id="eraser-button">
				<i class="fa-solid fa-eraser"></i>
			</button>
			<button class="game-button" id="reset-button">
				<i class="fa-solid fa-rotate-left"></i>
			</button>
		</footer>

		<script src="app.js" type="module"></script>
	</body>
</html>
